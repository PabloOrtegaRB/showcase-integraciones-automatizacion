[project]
name = "showcase-integraciones-automatizacion"
version = "1.0.0"
description = "Integración de órdenes de trabajo con un proveedor externo simulado: reintentos, webhooks firmados y registro de eventos. Proyecto demostrativo, desarrollo propio, no asociado a un cliente real."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
